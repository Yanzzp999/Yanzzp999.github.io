name: Generate Profile Assets

on:
  # 每 6 小时一次。刻意避开整点：GitHub 的 schedule 在 :00 是高峰，
  # 排队延迟明显，极端情况下会被丢弃。
  schedule:
    - cron: "17 */6 * * *"

  # 允许手动触发
  workflow_dispatch:

  # 推送到主分支时刷新
  push:
    branches:
      - main

# 所有产物都 force push 到同一个 output 分支。schedule 与 push 可能同时
# 触发，并发跑会互相覆盖，因此串行化。不取消进行中的运行，避免推送被打断
# 留下不完整的 output 分支。
concurrency:
  group: profile-assets
  cancel-in-progress: false

# 最小权限：只需要写 output 分支
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 贪吃蛇贡献图（浅色 + GitHub 深色模式各一份）
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 连续提交卡
      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight
          path: dist/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 统计卡（内置 GITHUB_TOKEN 即可，无需 PAT）
      - name: Generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@v0.12.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 8
          AUTO_PUSH: false
          THEME: tokyonight

      - name: Collect summary cards into dist
        run: |
          mkdir -p dist/cards
          cp profile-summary-card-output/tokyonight/*.svg dist/cards/
          echo "--- dist 内容 ---"
          find dist -type f | sort

      # 一次性推送。build_dir 会整体替换 output 分支内容，
      # 所以全部产物必须在同一次推送里。
      - name: Push assets to output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
