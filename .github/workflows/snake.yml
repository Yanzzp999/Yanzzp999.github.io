name: Generate Profile Assets

on:
  # 每6小时自动运行一次
  schedule:
    - cron: "0 */6 * * *"

  # 允许手动触发
  workflow_dispatch:

  # 每次推送到主分支时运行
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 生成贪吃蛇图（浅色 + GitHub 深色模式）
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 生成连续提交卡（静态 SVG，避免公共实例限流/超时）
      - name: Generate streak.svg
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight
          path: dist/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 生成统计卡（静态 SVG，用内置 GITHUB_TOKEN，无需 PAT/Vercel）
      - name: Generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 8
          AUTO_PUSH: false
          THEME: tokyonight

      # 汇总到 dist/，与贪吃蛇、streak 一并推送
      - name: Collect summary cards into dist
        run: |
          mkdir -p dist/cards
          cp profile-summary-card-output/tokyonight/*.svg dist/cards/
          ls -l dist dist/cards

      # 一次性把所有产物推到 output 分支
      # 注意：build_dir 会整体替换 output 分支内容，所以三个产物必须在同一次推送中
      - name: Push generated assets to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
